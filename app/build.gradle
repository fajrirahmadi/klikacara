apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'

apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 28
    signingConfigs {
        config {
            keyAlias 'key0'
            keyPassword 'android'
            storeFile file('klikacarakeystore.jks')
            storePassword 'android'
        }
    }
    defaultConfig {
        applicationId "co.id.klikacara"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 2
        versionName "1.0.1"
        signingConfig signingConfigs.config
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', "kycDb", kycDb
        buildConfigField 'String', "bannerDb", bannerDb
        buildConfigField 'String', "userDb", userDb
        buildConfigField 'String', "mitraDb", mitraDb
        buildConfigField 'String', "peralatanDb", peralatanDb
        buildConfigField 'String', "paketAcaraDb", paketAcaraDb
        buildConfigField 'String', "pengisiAcaraDb", pengisiAcaraDb
        buildConfigField 'String', "acaraDb", acaraDb
        buildConfigField 'String', "accountDb", accountDb
        buildConfigField 'String', "klikMenuDb", klikMenuDb
        buildConfigField 'String', "ulasanDb", ulasanDb
        buildConfigField 'String', "listOrderDb", listOrderDb
        buildConfigField 'String', "gmailKey", gmailKey
        buildConfigField 'String', "provinceDb", provinceDb
        buildConfigField 'String', "cityDb", cityDb
        buildConfigField 'String', "districtDb", districtDb
        buildConfigField 'String', "productDb", productDb
        buildConfigField 'String', "orderDb", orderDb
        buildConfigField 'String', "bankDb", bankDb
        buildConfigField 'String', "ratingDb", ratingDb
        buildConfigField 'String', "userData", userData
        buildConfigField 'String', "mitraData", mitraData
        buildConfigField 'String', "registrationData", registrationData
        buildConfigField 'String', "currentVersionKey", currentVersionKey
        buildConfigField 'String', "isMaintainKey", isMaintainKey
        buildConfigField 'String', "aboutUsKey", aboutUsKey
        buildConfigField 'String', "ppKey", ppKey
        buildConfigField 'String', "tncKey", tncKey
        buildConfigField 'String', "playStoreUrlKey", playStoreUrlKey


    }
    buildTypes {
        release {
            debuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.config
            //minifyEnabled true
            //useProguard true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kapt {
    generateStubs = true
}

android {
    defaultConfig {
        // Enabling multidex support.
        multiDexEnabled true
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.android.support:design:28.0.0'
    implementation "com.android.support:appcompat-v7:28.0.0"
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.material:material:1.1.0-alpha07'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    //validator
    implementation 'com.mobsandgeeks:android-saripaar:2.0.3'

    //butterknife
    implementation 'com.jakewharton:butterknife:10.1.0'
    kapt 'com.jakewharton:butterknife-compiler:10.1.0'

    //fastadaper
    implementation 'com.mikepenz:fastadapter:3.3.1'
    implementation 'com.mikepenz:fastadapter-commons:3.3.1'

    //commons-validator
    implementation group: 'commons-validator', name: 'commons-validator', version: '1.6'
    implementation 'org.apache.commons:commons-lang3:3.7'

    //cirle image view
    implementation 'de.hdodenhof:circleimageview:2.2.0'

    //slider dots
    implementation 'com.chabbal:slidingdotsplash:1.0.2'

    //play services
    implementation 'com.google.gms:google-services:4.3.0'
    implementation 'com.google.code.gson:gson:2.8.5'

    //AVLoadingIndicatorView
    implementation 'com.wang.avi:library:2.1.3'

    //Material Calendar
    implementation 'com.github.prolificinteractive:material-calendarview:2.0.0'

    //Firebase
    implementation 'com.firebase:firebase-client-android:2.3.1'
    implementation 'com.google.firebase:firebase-auth:18.0.0'
    implementation 'com.google.firebase:firebase-storage:18.0.0'
    implementation 'com.firebaseui:firebase-ui-storage:1.0.1'
    implementation 'com.google.android.gms:play-services-auth:17.0.0'
    implementation 'com.google.firebase:firebase-messaging:19.0.1'
    implementation 'com.google.firebase:firebase-core:17.0.0'
    implementation 'com.google.firebase:firebase-firestore:20.1.0'
    implementation 'com.google.firebase:firebase-dynamic-links:18.0.0'


    //Firebase config
    implementation 'com.google.firebase:firebase-config:18.0.0'

    //firebase database
    implementation 'com.google.firebase:firebase-database:18.0.0'

    //Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    //bottombar
    implementation 'com.github.ittianyu:BottomNavigationViewEx:2.0.0'

    //parceler
    implementation 'org.parceler:parceler-api:1.1.12'
    kapt 'org.parceler:parceler:1.1.12'

    //Easy image
    implementation 'com.github.jkwiecien:EasyImage:1.3.1'

    // Find the latest Glide releases here: https://goo.gl/LpksbR
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    kapt 'com.github.bumptech.glide:compiler:4.9.0'

    // Picasso
    implementation 'com.squareup.picasso:picasso:2.5.2'

//     Crashlityc
//    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.0'
//    implementation('com.crashlytics.sdk.android:crashlytics:2.9.5@aar') {
//        transitive = true;
//    }

    //Add badge BottomNavigation
    implementation 'q.rorbin:badgeview:1.1.0'

    //navigation architecture
    implementation 'androidx.navigation:navigation-fragment:2.1.0-alpha06'

    // use -ktx for Kotlin
    implementation 'androidx.navigation:navigation-ui:2.1.0-alpha06'

    // Anko Commons
    implementation "org.jetbrains.anko:anko-commons:0.10.5"
    implementation "org.jetbrains.anko:anko-design:0.10.5"
    implementation "org.jetbrains.anko:anko-support-v4-commons:0.10.5"

    // Anko Layouts
    implementation "org.jetbrains.anko:anko-sdk25:0.10.5" // sdk15, sdk19, sdk21, sdk23 are also available
    implementation "org.jetbrains.anko:anko-appcompat-v7:0.10.5"

    //shimmer
    implementation 'com.facebook.shimmer:shimmer:0.4.0'

    // dagger
    kapt "com.google.dagger:dagger-compiler:2.17"
    implementation 'com.google.dagger:dagger:2.17'

    // dagger android
    kapt "com.google.dagger:dagger-android-processor:2.17"
    implementation 'com.google.dagger:dagger-android:2.17'
    implementation 'com.google.dagger:dagger-android-support:2.17'

    //compressor
    implementation 'id.zelory:compressor:2.1.0'

    //rxpermission
    implementation 'com.github.tbruyelle:rxpermissions:0.10.2'

    //RxBinding
    implementation 'io.reactivex.rxjava2:rxjava:2.2.9'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.jakewharton.rxbinding2:rxbinding:2.1.1'

}
apply plugin: 'com.google.gms.google-services'
